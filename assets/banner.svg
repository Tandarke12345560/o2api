<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <defs>
    <linearGradient id="line" x1="80" y1="0" x2="1120" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#131A26"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="40" r="180" fill="#7C3AED" opacity="0.10"/>
  <circle cx="1180" cy="250" r="140" fill="#22D3EE" opacity="0.08"/>

  <g transform="translate(80 84)">
    <rect width="112" height="112" rx="26" fill="#111827" stroke="url(#line)" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M34 42 L20 56 L34 70" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 42 L92 56 L78 70" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 34 L50 78" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="222" y="128" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="62" font-weight="700" fill="#F9FAFB">o2<tspan fill="url(#line)">api</tspan></text>
  <text x="224" y="166" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="22" fill="#9CA3AF">OpenCode  →  OpenAI-compatible API</text>

  <g font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16">
    <rect x="222" y="190" width="152" height="34" rx="17" fill="#7C3AED" opacity="0.16"/>
    <rect x="222" y="190" width="152" height="34" rx="17" stroke="#7C3AED" stroke-opacity="0.5"/>
    <text x="246" y="212" fill="#C4B5FD">zero deps</text>

    <rect x="386" y="190" width="168" height="34" rx="17" fill="#22D3EE" opacity="0.14"/>
    <rect x="386" y="190" width="168" height="34" rx="17" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="410" y="212" fill="#A5F3FC">one command</text>

    <rect x="566" y="190" width="176" height="34" rx="17" fill="#34D399" opacity="0.14"/>
    <rect x="566" y="190" width="176" height="34" rx="17" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="590" y="212" fill="#A7F3D0">OpenAI SDK ok</text>
  </g>

  <g transform="translate(840 96)" filter="url(#glow)" opacity="0.9">
    <text x="0" y="30" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#22D3EE">POST /v1/chat/completions</text>
    <text x="0" y="66" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#9CA3AF">GET  /v1/models</text>
    <text x="0" y="102" font-family="'DejaVu Sans Mono', monospace" font-size="20" fill="#9CA3AF">GET  /health</text>
  </g>
</svg>
